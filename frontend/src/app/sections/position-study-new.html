<section class="new-study">
  <nav class="crumbs">
    <a [routerLink]="paths().studyList">{{ label() }}</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">Nuovo studio</span>
  </nav>

  <header class="page-head">
    <p class="page-kicker">{{ label() }}</p>
    <h2 class="page-title">Nuovo studio</h2>
    <p class="page-sub">
      Crea uno studio in cui raccogliere le tue posizioni. Il nome è obbligatorio;
      la descrizione è facoltativa.
    </p>
  </header>

  <form class="study-form" (ngSubmit)="submit()">
    <app-study-form-fields
      [(name)]="name"
      [(description)]="description"
      [(color)]="color"
      [showColor]="false"
      [disabled]="saving()"
    />

    @if (requiresStudyType()) {
      <label class="field">
        <span class="field-label">Tipologia</span>
        <select
          class="field-input"
          name="studyType"
          [ngModel]="studyType()"
          (ngModelChange)="studyType.set($event)"
          [disabled]="saving()"
          required
        >
          <option value="" disabled>Scegli tipologia&#8230;</option>
          <option value="TACTICAL">{{ studyTypeLabel('TACTICAL') }}</option>
          <option value="STRATEGIC">{{ studyTypeLabel('STRATEGIC') }}</option>
        </select>
      </label>
    }

    @if (error()) {
      <p class="page-error">{{ error() }}</p>
    }

    <div class="form-actions">
      <a class="btn btn--ghost" [routerLink]="paths().studyList">Annulla</a>
      <button class="btn btn--primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Salvataggio…' : 'Crea studio' }}
      </button>
    </div>
  </form>
</section>
