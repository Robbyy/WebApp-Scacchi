# ISSUE-016/R26.3: evento minimo di tentativo su una posizione Mediogioco (design.md decisione 6).
# Nessuna colonna per mosse/durata/sessione/FEN: solo posizione, esito e istante server. FK reale
# (a differenza delle altre relazioni study_id/variant_id del progetto, tutte prive di vincolo)
# con ON DELETE CASCADE: la cancellazione di una posizione elimina i suoi eventi senza intervento
# applicativo; la cancellazione dello studio propaga già alle posizioni via StudyService.
databaseChangeLog:
  - changeSet:
      id: 0007-position-attempt
      author: scacchi
      comment: Crea lo storico immutabile dei tentativi di posizione con cascade reale verso variant.
      changes:
        - createTable:
            tableName: position_attempt
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: variant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: outcome, type: VARCHAR(24), constraints: { nullable: false } }
              - column: { name: occurred_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_position_attempt_variant
            baseTableName: position_attempt
            baseColumnNames: variant_id
            referencedTableName: variant
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: position_attempt
            indexName: idx_position_attempt_variant_history
            columns:
              - column: { name: variant_id }
              - column: { name: occurred_at }
              - column: { name: id }
