# ISSUE-016/R26.3: catalogo relazionale dei temi di Mediogioco (design.md decisione 3).
# ID espliciti e stabili (1001-1014 tattici, 2001-2013 strategici) per riferimento
# stabile fra ambienti e backup. `code` è univoco soltanto insieme a `study_type`, non a
# livello globale: i due cataloghi sono indipendenti e `KING_ATTACK` compare in entrambi
# (1012 tattico, 2011 strategico) con significato analogo. L'unico identificativo
# referenziato dalle posizioni resta l'`id` (Variant.theme_id, changeset 0006).
databaseChangeLog:
  - changeSet:
      id: 0005-position-theme
      author: scacchi
      comment: Crea il catalogo dei temi di Mediogioco con seed stabile e vincolo composito su (code, study_type).
      changes:
        - createTable:
            tableName: position_theme
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: study_type, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: display_label, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: display_order, type: INT, constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: position_theme
            columnNames: code, study_type
            constraintName: uk_position_theme_code_study_type
        - createIndex:
            tableName: position_theme
            indexName: idx_position_theme_study_type_order
            columns:
              - column: { name: study_type }
              - column: { name: display_order }
        - insert:
            tableName: position_theme
            columns:
              - column: { name: id, valueNumeric: 1001 }
              - column: { name: code, value: DOUBLE_ATTACK }
              - column: { name: study_type, value: TACTICAL }
              - column: { name: display_label, value: doppio attacco }
              - column: { name: display_order, valueNumeric: 1 }
              - column: { name: active, valueBoolean: true }
